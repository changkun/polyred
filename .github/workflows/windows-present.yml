name: windows-present

# Runs the Win32 + ANGLE windowed present path (TestWin32WindowedPresent) for real:
# ANGLE (libEGL/libGLESv2/d3dcompiler) is not on the runner's PATH by default, but
# it ships with every Chromium-based install (Edge, the WebView2 runtime, Chrome);
# find one wherever the current runner image put it, then run the test with
# POLYRED_REQUIRE_WINDOW=1 so a skip (ANGLE missing / window surface failing) becomes
# a hard failure. This is the Windows analog of the gl-probe x11-windowed-present job.
# A dedicated workflow (not a polyred matrix step) so the ANGLE provisioning is
# isolated. ANGLE-on-WARP presents correctly headlessly on the windows-latest runner.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  windows-present:
    name: Win32 + ANGLE windowed present
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        check-latest: true

    - name: Provision ANGLE (libEGL/libGLESv2/d3dcompiler from any Chromium install)
      shell: pwsh
      run: |
        # Do not pin a browser or a version directory: the runner image moves these
        # between releases, and hardcoding "Edge or Chrome" is what broke this job.
        # As of the 2026-08 image, Edge and Chrome no longer ship libEGL.dll at all;
        # Firefox does. So search every vendor that ships an ANGLE build.
        $vendors = @(
          "Microsoft\EdgeWebView\Application",
          "Microsoft\Edge\Application",
          "Google\Chrome\Application",
          "Mozilla Firefox"
        )
        $roots = foreach ($pf in @("C:\Program Files", "C:\Program Files (x86)")) {
          foreach ($v in $vendors) { Join-Path $pf $v }
        }
        $roots = $roots | Where-Object { Test-Path $_ }

        function Find-Angle($paths, $depth) {
          Get-ChildItem $paths -Recurse -Depth $depth -Filter libEGL.dll -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.DirectoryName "libGLESv2.dll") } |
            Select-Object -First 1
        }

        $egl = $null
        if ($roots) { $egl = Find-Angle $roots 3 }

        # Fall back to a shallow sweep of the vendor directories under Program Files.
        # Bounded by -Depth on purpose: an unbounded -Recurse over both trees took ten
        # minutes on the runner.
        if (-not $egl) {
          Write-Host "ANGLE not in the known vendor paths; sweeping Program Files."
          $sweep = @("C:\Program Files", "C:\Program Files (x86)") | Where-Object { Test-Path $_ }
          $egl = Find-Angle $sweep 4
        }

        if (-not $egl) {
          Write-Host "No ANGLE on this runner. Installed under Program Files:"
          Get-ChildItem "C:\Program Files", "C:\Program Files (x86)" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.FullName)" }
          Write-Error "libEGL.dll + libGLESv2.dll not found; provisioning needs a new source"
          exit 1
        }

        # Put the install directory itself on PATH rather than copying the two DLLs
        # out of it. Every shipped ANGLE build links against siblings that live beside
        # it (Firefox's needs mozglue.dll, Chromium's wants d3dcompiler_47.dll), so a
        # copy of just libEGL + libGLESv2 loads as "the specified module could not be
        # found" even though both files are present.
        $dir = $egl.DirectoryName
        Write-Host "ANGLE found in: $dir"
        Get-ChildItem $dir -Filter "*.dll" | Where-Object { $_.Name -match "libEGL|libGLESv2|d3dcompiler|mozglue" } |
          ForEach-Object { Write-Host "  $($_.Name) ($($_.Length) bytes)" }
        $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Windowed present (Win32 + ANGLE)
      env:
        # Turn "no ANGLE runtime / window surface failed" skips into hard failures:
        # this job provisions ANGLE, so a skip here would hide a real break.
        POLYRED_REQUIRE_WINDOW: '1'
      run: go test -run TestWin32WindowedPresent -v -timeout 10m ./app/
